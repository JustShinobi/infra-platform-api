name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_image:
        description: Publish the image and open an image promotion PR
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/justshinobi/infra-platform-api
  UV_PYTHON_DOWNLOADS: never

jobs:
  detect-image-changes:
    name: Detect image changes
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.changes.outputs.image }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect runtime image changes
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          FORCE_PUBLISH: ${{ inputs.publish_image }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "image=${FORCE_PUBLISH:-false}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            changed_files=$(git diff-tree --root --no-commit-id --name-only -r "$GITHUB_SHA")
          else
            changed_files=$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")
          fi

          image_changed=false
          while IFS= read -r path; do
            case "$path" in
              app/*|Dockerfile|.dockerignore|gunicorn.conf.py|pyproject.toml|uv.lock)
                image_changed=true
                break
                ;;
            esac
          done <<< "$changed_files"

          echo "image=$image_changed" >> "$GITHUB_OUTPUT"

  test-and-validate:
    name: Test and validate manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.20"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: |
          uv lock --check
          uv sync --frozen

      - name: Audit Python dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project \
            --output-file /tmp/runtime-requirements.txt
          uv run --frozen pip-audit \
            --require-hashes --disable-pip \
            --requirement /tmp/runtime-requirements.txt

      - name: Run unit and endpoint tests
        run: uv run --frozen python -m unittest discover -s tests -v

      - name: Lint and check Python formatting
        run: |
          uv run --frozen ruff check app tests
          uv run --frozen ruff format --check app tests

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.36.3

      - name: Render every Kustomize overlay
        run: |
          mkdir -p rendered
          kubectl kustomize k8s/overlays/dev > rendered/dev.yaml
          kubectl kustomize k8s/overlays/prod > rendered/prod.yaml

      - name: Validate manifests against Kubernetes schemas
        run: |
          docker run --rm \
            --volume "$PWD/rendered:/manifests:ro" \
            ghcr.io/yannh/kubeconform@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e \
            -strict -summary -kubernetes-version 1.36.0 /manifests

  container-test:
    name: Build and smoke-test container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test-and-validate
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build container for runtime validation
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: infra-platform-api:ci
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate hardened container at runtime
        env:
          EXPECTED_VERSION: ${{ github.sha }}
        run: |
          docker run --rm \
            --read-only \
            --user 10001:10001 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --volume "$PWD/tests:/app/tests:ro" \
            --entrypoint python \
            infra-platform-api:ci \
            -m unittest discover -s tests -v

          docker run --detach --name infra-platform-api-ci \
            --read-only \
            --user 10001:10001 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --publish 18080:8080 \
            --env APP_ENV=ci \
            --env 'APP_MESSAGE=validated by CI' \
            infra-platform-api:ci
          trap 'docker logs infra-platform-api-ci; docker rm --force infra-platform-api-ci' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/healthz > health.json; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo 'Container did not become healthy' >&2
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent --show-error http://127.0.0.1:18080/info > info.json
          python - <<'PY'
          import json
          import os

          with open("health.json", encoding="utf-8") as file:
              assert json.load(file) == {"status": "ok"}

          with open("info.json", encoding="utf-8") as file:
              info = json.load(file)

          assert info["version"] == os.environ["EXPECTED_VERSION"]
          assert info["environment"] == "ci"
          assert info["message"] == "validated by CI"
          assert info["hostname"]
          PY

          test "$(docker inspect --format '{{.Config.User}}' infra-platform-api-ci)" = '10001:10001'
          test "$(docker inspect --format '{{.State.Running}}' infra-platform-api-ci)" = 'true'

          if docker exec infra-platform-api-ci python -c 'import pip' 2>/dev/null; then
            echo 'pip must not be importable in the runtime image' >&2
            exit 1
          fi

          if docker exec infra-platform-api-ci python -c 'import setuptools' 2>/dev/null; then
            echo 'setuptools must not be importable in the runtime image' >&2
            exit 1
          fi

      - name: Scan container for fixable vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: infra-platform-api:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  publish:
    name: Publish container
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.detect-image-changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [detect-image-changes, test-and-validate, container-test]
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main,enable={{is_default_branch}}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Export the published image for offline validation
        run: |
          IMAGE="${IMAGE_NAME}:sha-${GITHUB_SHA::7}"
          docker pull "$IMAGE"
          docker save "$IMAGE" | gzip -1 > infra-platform-api-image.tar.gz

      - name: Upload short-lived validation image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: infra-platform-api-image-${{ github.sha }}
          path: infra-platform-api-image.tar.gz
          if-no-files-found: error
          retention-days: 1

  promote:
    name: Open image promotion PR
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: publish
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Update overlay image digests
        run: |
          if ! [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Unexpected image digest: $IMAGE_DIGEST" >&2
            exit 1
          fi

          for file in \
            k8s/overlays/dev/kustomization.yaml \
            k8s/overlays/prod/kustomization.yaml; do
            python3 - "$file" "$IMAGE_DIGEST" <<'PY'
          import pathlib
          import re
          import sys

          path = pathlib.Path(sys.argv[1])
          digest = sys.argv[2]
          content = path.read_text(encoding="utf-8")
          updated, replacements = re.subn(
              r"(?m)^(\s+digest: )sha256:[0-9a-f]{64}$",
              rf"\g<1>{digest}",
              content,
          )
          if replacements != 1:
              raise SystemExit(f"expected one digest in {path}, found {replacements}")
          path.write_text(updated, encoding="utf-8")
          PY
          done

          git diff --check

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.36.3

      - name: Validate promoted manifests
        run: |
          mkdir -p rendered
          kubectl kustomize k8s/overlays/dev > rendered/dev.yaml
          kubectl kustomize k8s/overlays/prod > rendered/prod.yaml
          docker run --rm \
            --volume "$PWD/rendered:/manifests:ro" \
            ghcr.io/yannh/kubeconform@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e \
            -strict -summary -kubernetes-version 1.36.0 /manifests

      - name: Create or update promotion pull request
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          short_sha=${SOURCE_SHA::7}
          existing_pr=$(gh pr list \
            --state open \
            --base main \
            --json number,headRefName \
            --jq '([.[] | select(.headRefName | startswith("chore/promote-image-"))] | first) as $pr | if $pr then "\($pr.number)\t\($pr.headRefName)" else "" end')

          if [ -n "$existing_pr" ]; then
            pr_number=${existing_pr%%$'\t'*}
            branch=${existing_pr#*$'\t'}
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
            remote_sha=$(git rev-parse "refs/remotes/origin/$branch")
          else
            pr_number=""
            branch="chore/promote-image-$short_sha"
            remote_sha=""
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$branch"
          git add k8s/overlays/dev/kustomization.yaml k8s/overlays/prod/kustomization.yaml
          git commit -m "chore(kustomize): promote image $short_sha"

          if [ -n "$remote_sha" ]; then
            git push \
              --force-with-lease="refs/heads/$branch:$remote_sha" \
              origin "HEAD:refs/heads/$branch"
          else
            git push --set-upstream origin "$branch"
          fi

          cat > /tmp/promotion-pr.md <<EOF
          ## Summary
          Promote the container image built from commit \`$SOURCE_SHA\` using its immutable OCI digest.

          ## Changes
          - update the development overlay image digest
          - update the production overlay image digest

          ## Validation
          - application tests, container smoke tests, dependency audit, and vulnerability scan passed before publication
          - both overlays rendered successfully
          - all rendered resources passed strict kubeconform validation

          Source workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF

          title="chore(kustomize): promote image $short_sha"
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --title "$title" --body-file /tmp/promotion-pr.md
          else
            gh pr create \
              --base main \
              --head "$branch" \
              --title "$title" \
              --body-file /tmp/promotion-pr.md
          fi
