name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/justshinobi/infra-platform-api
  UV_PYTHON_DOWNLOADS: never

jobs:
  test-and-validate:
    name: Test and validate manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.20"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: |
          uv lock --check
          uv sync --frozen

      - name: Audit Python dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project \
            --output-file /tmp/runtime-requirements.txt
          uv run --frozen pip-audit \
            --require-hashes --disable-pip \
            --requirement /tmp/runtime-requirements.txt

      - name: Run unit and endpoint tests
        run: uv run --frozen python -m unittest discover -s tests -v

      - name: Check Python syntax
        run: uv run --frozen python -m compileall -q app tests

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.36.3

      - name: Render every Kustomize overlay
        run: |
          mkdir -p rendered
          kubectl kustomize k8s/overlays/dev > rendered/dev.yaml
          kubectl kustomize k8s/overlays/prod > rendered/prod.yaml

      - name: Validate manifests against Kubernetes schemas
        run: |
          docker run --rm \
            --volume "$PWD/rendered:/manifests:ro" \
            ghcr.io/yannh/kubeconform@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e \
            -strict -summary -kubernetes-version 1.36.0 /manifests

  container-test:
    name: Build and smoke-test container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test-and-validate
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build container for runtime validation
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: infra-platform-api:ci
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate hardened container at runtime
        env:
          EXPECTED_VERSION: ${{ github.sha }}
        run: |
          docker run --rm \
            --read-only \
            --user 10001:10001 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --volume "$PWD/tests:/app/tests:ro" \
            --entrypoint python \
            infra-platform-api:ci \
            -m unittest discover -s tests -v

          docker run --detach --name infra-platform-api-ci \
            --read-only \
            --user 10001:10001 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --publish 18080:8080 \
            --env APP_ENV=ci \
            --env 'APP_MESSAGE=validated by CI' \
            infra-platform-api:ci
          trap 'docker logs infra-platform-api-ci; docker rm --force infra-platform-api-ci' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/healthz > health.json; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo 'Container did not become healthy' >&2
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent --show-error http://127.0.0.1:18080/info > info.json
          python - <<'PY'
          import json
          import os

          with open("health.json", encoding="utf-8") as file:
              assert json.load(file) == {"status": "ok"}

          with open("info.json", encoding="utf-8") as file:
              info = json.load(file)

          assert info["version"] == os.environ["EXPECTED_VERSION"]
          assert info["environment"] == "ci"
          assert info["message"] == "validated by CI"
          assert info["hostname"]
          PY

          test "$(docker inspect --format '{{.Config.User}}' infra-platform-api-ci)" = '10001:10001'
          test "$(docker inspect --format '{{.State.Running}}' infra-platform-api-ci)" = 'true'

          if docker exec infra-platform-api-ci python -c 'import pip' 2>/dev/null; then
            echo 'pip must not be importable in the runtime image' >&2
            exit 1
          fi

          if docker exec infra-platform-api-ci python -c 'import setuptools' 2>/dev/null; then
            echo 'setuptools must not be importable in the runtime image' >&2
            exit 1
          fi

      - name: Scan container for fixable vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: infra-platform-api:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  publish:
    name: Publish container
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test-and-validate, container-test]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main,enable={{is_default_branch}}

      - name: Build and publish image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Export the published image for offline validation
        run: |
          IMAGE="${IMAGE_NAME}:sha-${GITHUB_SHA::7}"
          docker pull "$IMAGE"
          docker save "$IMAGE" | gzip -1 > infra-platform-api-image.tar.gz

      - name: Upload short-lived validation image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: infra-platform-api-image-${{ github.sha }}
          path: infra-platform-api-image.tar.gz
          if-no-files-found: error
          retention-days: 1
