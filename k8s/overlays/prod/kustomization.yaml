kind: Kustomization
namespace: infra-platform-prod
resources:
  - ../../base
  - namespace.yaml
  - poddisruptionbudget.yaml
configMapGenerator:
  - name: infra-platform-api-config
    behavior: merge
    literals:
      - APP_ENV=production
      - APP_MESSAGE=hello from the production overlay
