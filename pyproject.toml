[project]
name = "infra-platform-api"
version = "0.1.0"
description = "API Flask enxuta para execução segura em Kubernetes"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "Flask==3.1.3",
  "gunicorn==26.2.0",
]

[dependency-groups]
dev = [
  "pip-audit==2.10.1",
  "ruff==0.16.9",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]
